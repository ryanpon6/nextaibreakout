<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<!-- Placeholders: {{period_label}} default "Breakouts since Oct 15" (switch to "Breakouts: week of {{date}}" once 7 days of data exist), {{issue}}, {{date}}, {{item1}}-{{item3}}. Keep item names short (~40 chars). -->
