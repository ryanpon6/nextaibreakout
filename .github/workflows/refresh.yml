# NextAiBreakout hourly refresh on GitHub Actions (replaces box cron / tick-loop).
# Four schedule slots per hour (GitHub drops scheduled runs); ci/gate.py makes later slots a no-op while the site is fresh,
# so a dropped or late slot costs at most ~15 min of freshness. Cron times are UTC.
name: hourly-refresh
on:
  # LIVE since 2026-10-18 (switchover approved by Ryan); box tick-loop stopped, run.sh/cron-tick.sh kept for manual fallback.
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      force: { description: "Refresh even if the live site is fresh", type: boolean, default: false }
      deploy: { description: "Deploy to Cloudflare Pages", type: boolean, default: true }
concurrency: { group: refresh, cancel-in-progress: false }   # never two runs touching state at once
permissions: { contents: write }                              # push to the `state` branch only
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: { TZ: America/Edmonton, SEO2: "1", LABS: "1", GROKBOT: "1", KIT: "1", PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - name: Freshness gate (live data.json)
        id: gate
        env: { FORCE: "${{ inputs.force }}" }
        run: python3 ci/gate.py
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Restore state
        if: steps.gate.outputs.run == 'true'
        run: ci/state.sh init && ci/state.sh restore
      - name: Pipeline (fetch, score, archive, labs, build, selfcheck)
        id: pipeline
        if: steps.gate.outputs.run == 'true'
        env: { GITHUB_TOKEN: "${{ github.token }}", DEPLOY: "0" }   # token = authenticated GitHub search (30/min)
        run: ./run.sh
      - name: Save state (archive is recorded even when selfcheck blocks the deploy, same as the box)
        if: always() && steps.gate.outputs.run == 'true' && steps.pipeline.outcome != 'skipped'
        run: ci/state.sh save
      - name: Deploy to Cloudflare Pages
        if: steps.pipeline.outcome == 'success' && (github.event_name == 'schedule' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy dist --project-name nextaibreakout --branch main --commit-dirty=true
      - name: Verify live site
        if: steps.pipeline.outcome == 'success' && (github.event_name == 'schedule' || inputs.deploy)
        run: python3 ci/verify_live.py
      - name: Staleness alarm (site was stale before this run, so earlier slots were missed)
        if: steps.gate.outputs.stale == 'true'
        run: |
          echo "::error::Live site was ${{ steps.gate.outputs.age_min }} min old before this run (last ${{ steps.gate.outputs.generated }}). Refreshed now; check for missed schedules."
          exit 1
