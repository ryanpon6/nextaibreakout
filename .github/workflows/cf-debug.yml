# TEMPORARY (2026-10-18): diagnose Cloudflare auth for hourly-refresh. Prints no secret values. Delete after use.
name: cf-auth-debug
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Shape checks (lengths and whitespace only)
        run: |
          T="$CLOUDFLARE_API_TOKEN"; A="$CLOUDFLARE_ACCOUNT_ID"
          echo "token: set=$([ -n "$T" ] && echo yes || echo no) len=${#T} has_whitespace=$([[ "$T" =~ [[:space:]] ]] && echo YES || echo no) prefix_cfat=$([[ "$T" == cfat_* ]] && echo yes || echo no)"
          echo "account_id: set=$([ -n "$A" ] && echo yes || echo no) len=${#A} has_whitespace=$([[ "$A" =~ [[:space:]] ]] && echo YES || echo no) is_32_hex=$([[ "$A" =~ ^[0-9a-f]{32}$ ]] && echo yes || echo no) equals_runsh_id=$([[ "$A" == fdc58fb4586f5e0eea17aaebad49c994 ]] && echo yes || echo no)"
      - name: Cloudflare API probes (status codes and error codes only)
        run: |
          api() { curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          show() { echo "$1 -> HTTP $2 $(jq -c '{success, errors: [.errors[]? | {code, message}], status: .result.status?}' /tmp/r.json 2>/dev/null)"; }
          c=$(api /user/tokens/verify); show "GET /user/tokens/verify" $c
          c=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"); show "GET /accounts/<id>/tokens/verify" $c
          c=$(api /accounts); echo "GET /accounts -> HTTP $c count=$(jq '.result|length' /tmp/r.json 2>/dev/null) contains_secret_id=$(jq --arg a "$CLOUDFLARE_ACCOUNT_ID" '[.result[]?.id]|index($a)!=null' /tmp/r.json 2>/dev/null) contains_runsh_id=$(jq '[.result[]?.id]|index("fdc58fb4586f5e0eea17aaebad49c994")!=null' /tmp/r.json 2>/dev/null)"
          c=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/nextaibreakout"); show "GET /accounts/<id>/pages/projects/nextaibreakout" $c
          c=$(api "/accounts/fdc58fb4586f5e0eea17aaebad49c994/pages/projects/nextaibreakout"); show "GET /accounts/<runsh id>/pages/projects/nextaibreakout" $c
          echo "runner public IP: $(curl -s https://api.ipify.org)"
      - name: wrangler whoami
        run: ./node_modules/.bin/wrangler whoami || true
