<text x="120" y="145" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="28" fill="#3DDC84">BREAKOUTS · ISSUE #{{issue}} · {{date}}</text>
<text x="120" y="230" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-weight="bold" font-size="64" fill="#F2F2F2">{{period_label}}</text>
<text x="120" y="310" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="36" fill="#F2F2F2"><tspan fill="#3DDC84">1 </tspan>{{item1}}</text>
<text x="120" y="370" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="36" fill="#F2F2F2"><tspan fill="#3DDC84">2 </tspan>{{item2}}</text>
<text x="120" y="430" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="36" fill="#F2F2F2"><tspan fill="#3DDC84">3 </tspan>{{item3}}</text>
<text x="1080" y="505" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="26" fill="#3DDC84">nextaibreakout.com</text>
</svg>